name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # Validates the manifest plus the skills, agents and commands in the tree.
      # Needs no API key — validation is local and offline.
      - run: claude plugin validate . --strict
