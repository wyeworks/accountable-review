name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand against any branch, from the Actions tab. This is here because a push
  # made by an agent's credentials does not create a workflow run, so a branch pushed that
  # way has no CI at all until a person acts — and the only person-shaped action that used
  # to work was opening the pull request, which fires once and never again as the branch
  # moves. Re-running that first run is no substitute: it replays the commit it ran on.
  workflow_dispatch:

# `bin/evals offline` runs everything below locally, in one command. The steps here stay
# explicit rather than calling it: a job step is what attributes a failure to a suite in the
# Actions UI, and a dispatcher that quietly stopped running one would be this repository's own
# recurring defect — a check that reads as verified because it never looked. The two lists are
# therefore duplicated on purpose, and `bin/evals offline` carries a `parity` line that fails if
# a `run:` here names a script under skills/ that its suite table does not cover.
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # Validates the manifest plus the skills, agents and commands in the tree.
      # Needs no API key — validation is local and offline.
      - run: claude plugin validate . --strict

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, and not the runner's system Ruby: minitest is a BUNDLED gem rather than a
      # default one, so `require "minitest/autorun"` is not guaranteed on a bare image. The
      # pin also keeps the job comparable run to run, for the same reason run.sh puts the
      # model and effort on every result line.
      # Keep this in step with the repo-root .tool-versions, which pins the same thing for the
      # same reason so `bin/evals offline` needs no prefix locally.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The checks, checked: every fragment in evals/golden plants one defect and a row in
      # self-test-cases.txt asserts the verdict. No model, no API key, a couple of seconds. A
      # check script that always passes is worse than none, so this runs on every push.
      - run: ruby skills/review-map/evals/checks/self-test.rb
      # The region scanner, checked directly — the seam the shell version had nowhere to put.
      - run: ruby skills/review-map/evals/checks/lib/test/test_page.rb
      # And the frozen corpus: every case's exact output, recorded from the implementation
      # that equivalence.rb had just proved identical to the shell, over ~1900 cases. This is
      # what replaced that oracle when the shell was deleted, and it is the only thing left
      # that would notice a rule quietly changing what it says.
      - run: skills/review-map/evals/checks/frozen.rb

  ci-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deterministic half of the CI setup: what the generated workflow contains, that
      # setup leaves other people's workflows alone, that running it twice is safe, that the
      # config file is respected, and that the delivery seam returns its contract. Then the
      # same trick as above — ten deliberate breaks, each of which must make the suite fail.
      - run: skills/setup-ci/tests/run.sh
      - run: skills/setup-ci/tests/self-test.sh

  review-map-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # review-map's prose is judged by running it; its SCRIPTS are ordinary software with right
      # answers, and this is that half. page-skeleton.sh emits the page's head, token block and
      # tint script straight into the page, so no model reads or types a colour — and the test
      # asserts that by partition: head + markup + tail must be the template's own bytes. Then
      # the same trick as the two jobs above, including two mutations of the script itself,
      # because a template mutation alone cannot exercise a comparison against that template.
      - run: skills/review-map/tests/run.sh
      - run: skills/review-map/tests/self-test.sh
