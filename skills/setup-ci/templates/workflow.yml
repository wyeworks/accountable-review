# Accountable Review — generated by /accountable-review:setup-ci.
#
# Re-run that command to regenerate this file; it will show you a diff before
# touching a version you have edited. Everything this job does is read-only: it
# reads the pull request, writes a static HTML Review Map to the runner's
# temporary directory, and uploads it as a build artifact. It never pushes, never
# comments, never approves, and never runs your application.
#
# Accountable Review: {{PLUGIN_REPO}} @ {{PLUGIN_REF}}
name: Accountable Review

# Only these three. A Review Map is generated when a pull request becomes worth
# reviewing and whenever the thing under review changes after that — not on
# every label, assignment or edit to the description.
#
#   draft opened / pushed to while draft  ->  nothing
#   ready_for_review                      ->  Review Map
#   synchronize (a push to a ready PR)    ->  Review Map, regenerated
#   reopened                              ->  Review Map
#
# `opened` is not in the list, so a pull request opened directly as ready for
# review gets its first Review Map on its next push. Add `opened` below if your
# team opens pull requests ready rather than starting them as drafts; the draft
# guard on the job still holds either way.
on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - reopened

# One run per pull request. Pushing three commits in a minute should cost one
# Review Map, not three — and the two obsolete ones would describe revisions
# nobody is reviewing any more.
concurrency:
  group: accountable-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job reads a pull request and produces a document. It needs nothing else,
# and asking for nothing else is what keeps a compromised dependency in a PR
# branch from being able to do anything with this token.
permissions:
  contents: read

jobs:
  review-map:
    name: Review Map
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT_MINUTES}}

    # Draft pull requests never get a Review Map: `synchronize` fires while a PR
    # is still a draft, and this is what makes those pushes free.
    #
    # The second clause skips pull requests from forks. A `pull_request` run from
    # a fork gets no secrets, so the job could not authenticate and would fail
    # confusingly on every external contribution. Skipping is the honest
    # outcome — the alternative, `pull_request_target`, would run with this
    # repository's secrets against a branch the contributor controls.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The Review Map is built from BASE...HEAD and traces code the diff did
          # not touch, so it needs real history. A shallow clone does not make it
          # fail; it makes it wrong.
          fetch-depth: 0
          persist-credentials: false

      # Cloned at a tag rather than installed from the marketplace, because
      # `claude plugin install` has no way to pin a version and a Review Map
      # should be attributable to one. The clone lands outside the workspace so
      # it never appears in the diff under review. It comes before Node because
      # the scope check below runs from it, and a pull request that turns out to
      # need no Review Map should not have installed a toolchain first.
      - name: Install Accountable Review {{PLUGIN_REF}}
        env:
          PLUGIN_REPO: {{PLUGIN_REPO}}
          PLUGIN_REF: {{PLUGIN_REF}}
        run: |
          git clone --quiet --depth 1 --branch "$PLUGIN_REF" \
            "https://github.com/$PLUGIN_REPO" "$RUNNER_TEMP/accountable-review"

      # A Review Map explains application code. A pull request that changes none
      # of it — a lockfile bump, a README fix, a batch of new specs — has nothing
      # for the map to explain, and every step after this one stands aside.
      #
      # The rule is PRESENCE, not amount: any application path and the map is
      # generated, however small the change, because what makes a change worth a
      # map is what it reaches rather than how big it is. There is no file count
      # and no line count in this workflow or in the script it calls.
      #
      # It cannot be an `if:` on the job, which is where a count would go: the
      # pull_request payload carries additions, deletions and changed_files but
      # not the list of paths, and the question is which files changed. So it
      # runs here, after the cheap half of the job.
      - name: Does this pull request change application code?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          "$RUNNER_TEMP/accountable-review/ci/application-code.sh" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/application-code.txt" || rc=$?
          cat "$RUNNER_TEMP/application-code.txt"
          # 0 is generate and 3 is skip; anything else is a diff this job could
          # not read, and that is a failure rather than a quiet skip.
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.verdict == 'generate'
        with:
          node-version: '{{NODE_VERSION}}'

      - name: Install Claude Code
        if: steps.scope.outputs.verdict == 'generate'
        run: npm install -g @anthropic-ai/claude-code@{{CLAUDE_CODE_VERSION}}

      - name: Generate the Review Map
        if: steps.scope.outputs.verdict == 'generate'
        env:
          # One of these two has to be a secret on this repository. Nothing else
          # in this job needs a credential.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Everything from the event goes through the environment rather than
          # into the script text: `${{ }}` interpolated into a `run:` block is
          # how a pull request branch gets to run shell on your runner.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/review-map
        run: |
          "$RUNNER_TEMP/accountable-review/ci/generate-review-map.sh" \
            --output "$OUTPUT_DIR" \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      # Where the Review Map goes is one decision, made here, by a provider that
      # generation knows nothing about. Changing `review_map.delivery.provider`
      # in .accountable-review.yml changes this step's answer and nothing else.
      - name: Resolve delivery
        id: delivery
        if: steps.scope.outputs.verdict == 'generate'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/review-map
        run: |
          "$RUNNER_TEMP/accountable-review/ci/delivery/deliver.sh" \
            --dir "$OUTPUT_DIR" \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      # The github-artifact provider names the destination; this step is the
      # standard upload that moves the bytes. A different provider delivers the
      # map itself, and this step stands aside.
      - name: Upload the Review Map
        if: steps.scope.outputs.verdict == 'generate' && steps.delivery.outputs.provider == 'github-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}
          path: ${{ runner.temp }}/review-map/
          retention-days: ${{ steps.delivery.outputs.retention_days }}
          if-no-files-found: error

      - name: Say where it went
        if: steps.scope.outputs.verdict == 'generate'
        env:
          LOCATION: ${{ steps.delivery.outputs.location }}
          BROWSABLE: ${{ steps.delivery.outputs.browsable }}
          STABLE_URL: ${{ steps.delivery.outputs.stable_url }}
        run: |
          {
            echo "## Review Map"
            echo
            if [ "$BROWSABLE" = true ]; then
              echo "[Open the Review Map]($STABLE_URL)"
            else
              echo "Download **$LOCATION** from the Artifacts section of this run,"
              echo "extract it, and open \`index.html\`."
            fi
            echo
            echo "It explains the change and helps you review it. It does not review it:"
            echo "there is no verdict, no score and no approval in there."
          } >> "$GITHUB_STEP_SUMMARY"

      # A skipped run and a broken one look identical from the outside, so the
      # skip says what it counted and names every path it discounted. An absence
      # nobody can account for is the thing this whole project is against.
      - name: Say why there is no Review Map
        if: steps.scope.outputs.verdict == 'skip'
        run: |
          {
            echo "## No Review Map for this pull request"
            echo
            echo "Nothing in it changes application code:"
            echo "${{ steps.scope.outputs.changed }} changed path(s), none of them code."
            echo
            echo "A Review Map explains what a change means and what it reaches"
            echo "outside its own diff, so there is nothing here for it to explain."
            echo "Push a change to application code and one is generated."
            echo
            echo "<details><summary>What changed, and how each path was counted</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/application-code.txt"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
