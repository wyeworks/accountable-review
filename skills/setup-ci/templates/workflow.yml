# Accountable Review — generated by /accountable-review:setup-ci.
#
# Re-run that command to regenerate this file; it will show you a diff before
# touching a version you have edited.
# SETUP:IF:comment
#
# What this job does to your repository is one comment. It reads the pull
# request, writes a static HTML Review Map to the runner's temporary directory,
# uploads it as a build artifact, and comments the link on the pull request. It
# never pushes, never approves, never touches code, sets no check, and never runs
# your application.
# SETUP:END:comment
# SETUP:IF:no-comment
#
# Everything this job does is read-only: it reads the pull request, writes a
# static HTML Review Map to the runner's temporary directory, and uploads it as a
# build artifact. It never pushes, never comments, never approves, and never runs
# your application.
# SETUP:END:no-comment
#
# Accountable Review: {{PLUGIN_REPO}} @ {{PLUGIN_REF}}
#
# The line below records the decisions setup confirmed — when a Review Map is
# generated, and whether the link is commented on the pull request — in the form
# setup takes them as flags. Re-running setup reads it back, so upgrading the pin
# above moves the version without reverting the choices someone made. Delete the
# line and the next run offers you the defaults again, as a diff.
# Decisions: {{DECISIONS}}
name: Accountable Review

# SETUP:IF:no-push
# A Review Map is generated when a pull request first becomes reviewable — and
# then never again, because pushes do not trigger this workflow.
#
#   draft opened / pushed to while draft  ->  nothing
#   opened (already ready for review)     ->  Review Map
#   ready_for_review (draft marked ready) ->  Review Map
#   reopened                              ->  Review Map
#   a push to a ready pull request        ->  nothing; the map is NOT regenerated
#
# This is the trade made deliberately: the map describes the revision that first
# made the pull request reviewable, so on a branch that keeps moving it goes
# stale silently — nothing on the page says the code has changed under it. Check
# the head SHA the map names against the pull request before trusting it, and
# re-run setup with --regenerate-on-push if that stops being an acceptable cost.
# SETUP:END:no-push
# SETUP:IF:push
# A Review Map is generated when a pull request becomes worth reviewing, and
# regenerated whenever the thing under review changes after that.
#
#   draft opened / pushed to while draft  ->  nothing
#   opened (already ready for review)     ->  Review Map
#   ready_for_review (draft marked ready) ->  Review Map
#   reopened                              ->  Review Map
#   a push to a ready pull request        ->  Review Map, regenerated
#
# The map always describes the current head, which is what stops a reviewer
# reading a page for a revision nobody is looking at any more. What it costs is a
# model run per push to a ready pull request; the concurrency group below is what
# keeps a burst of pushes costing one rather than one per commit.
# SETUP:END:push
#
# `labeled`, `edited`, `assigned` and the rest are absent for a firmer reason
# than any of the above: none of them changes the code under review, and a Review
# Map describes a revision.
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
# SETUP:IF:push
      - synchronize
# SETUP:END:push

# One run per pull request, superseded runs cancelled. Pushing three commits in a
# minute costs one Review Map rather than three, and the two obsolete ones would
# describe revisions nobody is reviewing. This does most of its work when pushes
# trigger the workflow; with them off it still covers a pull request toggled
# ready/draft/ready or reopened in quick succession, and it is what keeps the cost
# of turning them back on to one run per burst rather than one per commit.
concurrency:
  group: accountable-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# SETUP:IF:no-comment
# The job reads a pull request and produces a document. It needs nothing else,
# and asking for nothing else is what keeps a compromised dependency in a PR
# branch from being able to do anything with this token.
# SETUP:END:no-comment
# SETUP:IF:comment
# The job reads a pull request, produces a document, and links it in one comment.
# `pull-requests: write` is the entire cost of that link, and it is the only write
# this token can perform: it cannot push, cannot touch contents, cannot approve,
# and cannot set a check.
#
# Actions has no per-step permissions, so the scope is the job rather than the
# step. What keeps the model step away from this token is that Actions injects
# GITHUB_TOKEN into no step that does not ask for it — only the comment step at
# the end puts it in its `env`, so nothing in a pull request branch sees a
# write-capable credential while the map is being generated.
#
# Re-run setup with --no-pr-comment to drop the comment, and this line with it.
# SETUP:END:comment
permissions:
  contents: read
# SETUP:IF:comment
  pull-requests: write
# SETUP:END:comment

jobs:
  review-map:
    name: Review Map
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT_MINUTES}}

    # Draft pull requests never get a Review Map. `opened` fires for a pull
    # request opened as a draft, so without this guard every draft would cost a
    # model run at the moment it was opened — the opposite of what the triggers
    # intend. The same clause is what makes pushes affordable if you turn them
    # back on: `synchronize` fires for pushes to drafts too.
    #
    # The second clause skips pull requests from forks. A `pull_request` run from
    # a fork gets no secrets, so the job could not authenticate and would fail
    # confusingly on every external contribution. Skipping is the honest
    # outcome — the alternative, `pull_request_target`, would run with this
    # repository's secrets against a branch the contributor controls.
    # SETUP:IF:authors
    #
    # The author clauses skip pull requests opened by a bot. A dependency bump is
    # not a change a Review Map helps with: there is no judgment to stage and no
    # reading order to give, and a bot that opens its pull requests ready for
    # review rather than as drafts would spend a model run on each one the moment
    # it opened. These test the pull request AUTHOR, not github.actor, because a
    # human who reopens or marks ready a bot's pull request becomes the actor
    # while the bot stays the author.
    # SETUP:END:authors
    #
    # NOTHING HERE COUNTS FILES OR LINES, and that is deliberate rather than an
    # omission. How big a change is decides whether it earns a Review Map, but
    # the counts that decide it are over application paths only — a three-line
    # model change beside a five-thousand-line lockfile is a three-line change —
    # and the event payload carries `changed_files`, `additions` and `deletions`
    # for the whole diff with no file list at all. A threshold written here could
    # only ever count the wrong thing. It is a step, after the checkout: see
    # "Does this pull request change application code?" below.
    #
    # ONE THING ABOUT THE EXPRESSION BELOW, which produces a workflow file GitHub
    # rejects outright — no job, no run, and an error that does not say which line
    # it means.
    #
    # Keep every line at exactly six spaces of indentation. In a YAML folded
    # scalar (>-) a more-indented line is NOT folded: its newline survives into
    # the expression string. Do not align the parentheses. The operators lead
    # their lines here partly to remove the thing anyone would want to align.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
{{AUTHOR_CLAUSES}}

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The Review Map is built from BASE...HEAD and traces code the diff did
          # not touch, so it needs real history. A shallow clone does not make it
          # fail; it makes it wrong.
          fetch-depth: 0
          persist-credentials: false

      # Cloned at a tag rather than installed from the marketplace, because
      # `claude plugin install` has no way to pin a version and a Review Map
      # should be attributable to one. The clone lands outside the workspace so
      # it never appears in the diff under review. It comes before Node because
      # the scope check below runs from it, and a pull request that turns out to
      # need no Review Map should not have installed a toolchain first.
      - name: Install Accountable Review {{PLUGIN_REF}}
        env:
          PLUGIN_REPO: {{PLUGIN_REPO}}
          PLUGIN_REF: {{PLUGIN_REF}}
        run: |
          git clone --quiet --depth 1 --branch "$PLUGIN_REF" \
            "https://github.com/$PLUGIN_REPO" "$RUNNER_TEMP/accountable-review"

      # A Review Map explains application code. Two ways a pull request can fail
      # to be worth one — it changes no application code at all, or what it
      # changes is trivial — and every step after this one stands aside for
      # either. The thresholds live in .accountable-review.yml and are read from
      # the checkout at run time, so changing one never means regenerating this
      # file; there is no number in this workflow to edit.
      #
      # It cannot be an `if:` on the job, which is where a count would naturally
      # go. The pull_request payload carries additions, deletions and
      # changed_files for the WHOLE diff, and the counts that decide this are
      # over application paths only — a three-line model change beside a
      # five-thousand-line lockfile is a three-line change. The payload cannot
      # express that, so the gate runs here, after the cheap half of the job.
# SETUP:IF:push
      # The previous Review Map for this pull request, so the run can update it
      # over the new commits instead of rebuilding it — and, before that, so the
      # scope step below can ask whether these commits reach anything the map
      # says at all. Only reachable with `synchronize` on: a first run has
      # nothing to restore, and a pull request that gets one map has no second
      # run to restore it into.
      #
      # IT CARRIES NO VERDICT GUARD, and it sits above the step that decides the
      # verdict for exactly that reason: the second half of that decision is
      # about the restored map. Restoring ~80 KB unconditionally is cheaper than
      # the model run it is deciding about, and on a miss it is a no-op.
      #
      # A MISS IS NOT A FAILURE. It means a full generation, which is the better
      # page — the whole flag is a saving with a cost, so every way it can go
      # wrong leads to the page that has no cost. Nothing here is load-bearing
      # for correctness, and two existing rules are why: a half-written page
      # restored here carries a pending marker and carry-plan.sh refuses it, and
      # a run that dies after the restore leaves a page naming the OLD head,
      # which the generate step below refuses to deliver.
      #
      # The key is built from run-time expressions, so two renders of this file
      # with the same flags are the same bytes — the idempotency rule this whole
      # template is compared by. No date, no run id.
      - name: Restore the previous Review Map
        id: previous
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/review-map
          key: accountable-review-map-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: accountable-review-map-${{ github.event.pull_request.number }}-

      # ONLY WHEN THERE IS A PREVIOUS MAP TO REUSE, which is what the guard says:
      # `cache-matched-key` is empty on a cold cache, and a run with nothing
      # restored has nothing to carry and no searches to replay.
      #
      # Both halves of reusing a map replay the page's own recorded searches, and
      # every search recipe in the lens files is written with rg — so on a runner
      # without ripgrep every one of them refuses and the run rebuilds the page
      # from scratch. Correct, and the whole saving gone.
      #
      # IT CANNOT FAIL THE JOB, and that is deliberate rather than defensive. The
      # install is an optimisation; if it does not work the page is rebuilt, which
      # is the answer that costs more and is never wrong. A step that could turn a
      # Review Map into a red job to save a few minutes has the polarity backwards.
      - name: Install ripgrep, so the previous map's searches can be replayed
        if: steps.previous.outputs.cache-matched-key != ''
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep is already here"
            exit 0
          fi
          sudo apt-get install -y ripgrep \
            || { sudo apt-get update && sudo apt-get install -y ripgrep; } \
            || echo "no ripgrep: this run rebuilds the page instead of updating it"
# SETUP:END:push

      - name: Does this pull request change application code?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          "$RUNNER_TEMP/accountable-review/ci/application-code.sh" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/application-code.txt" || rc=$?
          cat "$RUNNER_TEMP/application-code.txt"
          # 0 is generate and 3 is skip; anything else is a diff this job could
          # not read, and that is a failure rather than a quiet skip.
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
# SETUP:IF:push

          # THE SAME QUESTION, ASKED AGAIN OVER THE COMMITS SINCE THE MAP WE
          # ALREADY HAVE. The gate above measures BASE...HEAD, so a README-only
          # push to a branch that changed application code earlier still answers
          # `generate` — the pull request contains application code, and nothing
          # up there can see that THIS push did not. The result is a model run
          # whose page says what the last page said.
          #
          # It downgrades this step's own verdict rather than adding a second
          # one, which is why no guard below moves: every later step already
          # stands aside on `verdict != 'generate'`, and the step that explains
          # a skip already fires on `verdict == 'skip'`.
          if [ "$rc" = 0 ]; then
            cur=0
            "$RUNNER_TEMP/accountable-review/ci/map-still-current.sh" \
              --dir "$RUNNER_TEMP/review-map" --head "$HEAD_SHA" \
              --plugin-dir "$RUNNER_TEMP/accountable-review" \
              > "$RUNNER_TEMP/still-current.txt" || cur=$?
            cat "$RUNNER_TEMP/still-current.txt"
            [ "$cur" = 0 ] || [ "$cur" = 3 ] || exit "$cur"
            if [ "$cur" = 0 ]; then
              {
                echo "verdict=skip"
                echo "reason=map-still-current"
                sed -n 's/^reason: /detail=/p' "$RUNNER_TEMP/still-current.txt" | head -n 1
              } >> "$GITHUB_OUTPUT"
            fi
          fi
# SETUP:END:push

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.verdict == 'generate'
        with:
          node-version: '{{NODE_VERSION}}'

      - name: Install Claude Code
        if: steps.scope.outputs.verdict == 'generate'
        run: npm install -g @anthropic-ai/claude-code@{{CLAUDE_CODE_VERSION}}

      - name: Generate the Review Map
        if: steps.scope.outputs.verdict == 'generate'
        env:
          # One of these two has to be a secret on this repository. Nothing else
          # in this job needs a credential. The first is an API key from the
          # Anthropic Console; the second is what `claude setup-token` prints,
          # and bills a Claude subscription instead of API credit.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Everything from the event goes through the environment rather than
          # into the script text: `${{ }}` interpolated into a `run:` block is
          # how a pull request branch gets to run shell on your runner.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/review-map
        run: |
          "$RUNNER_TEMP/accountable-review/ci/generate-review-map.sh" \
            --output "$OUTPUT_DIR" \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      # Where the Review Map goes is one decision, made here, by a provider that
      # generation knows nothing about. Changing `review_map.delivery.provider`
      # in .accountable-review.yml changes this step's answer and nothing else.
      - name: Resolve delivery
        id: delivery
        if: steps.scope.outputs.verdict == 'generate'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/review-map
        run: |
          "$RUNNER_TEMP/accountable-review/ci/delivery/deliver.sh" \
            --dir "$OUTPUT_DIR" \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      # The github-artifact provider names the destination; this step is the
      # standard upload that moves the bytes. A different provider delivers the
      # map itself, and this step stands aside.
      - name: Upload the Review Map
        id: upload
        if: steps.scope.outputs.verdict == 'generate' && steps.delivery.outputs.provider == 'github-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}
          path: ${{ runner.temp }}/review-map/
          retention-days: ${{ steps.delivery.outputs.retention_days }}
          if-no-files-found: error

# SETUP:IF:push
      # Kept for the next push, and only once this one has actually shipped.
      # success() is what makes the cache hold delivered pages rather than
      # whatever was in the directory when a step died — correctness does not
      # depend on it, since a half-written page is refused on the way back in,
      # but a cache entry nothing can use is still worth not writing.
      - name: Keep this Review Map for the next push
        if: success() && steps.scope.outputs.verdict == 'generate'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/review-map
          key: accountable-review-map-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
# SETUP:END:push

      - name: Say where it went
        if: steps.scope.outputs.verdict == 'generate'
        env:
          LOCATION: ${{ steps.delivery.outputs.location }}
          BROWSABLE: ${{ steps.delivery.outputs.browsable }}
          STABLE_URL: ${{ steps.delivery.outputs.stable_url }}
        run: |
          {
            echo "## Review Map"
            echo
            if [ "$BROWSABLE" = true ]; then
              echo "[Open the Review Map]($STABLE_URL)"
            else
              echo "Download **$LOCATION** from the Artifacts section of this run,"
              echo "extract it, and open \`index.html\`."
            fi
            echo
            echo "It explains the change and helps you review it. It does not review it:"
            echo "there is no verdict, no score and no approval in there."
          } >> "$GITHUB_STEP_SUMMARY"

      # A skipped run and a broken one look identical from the outside, so the
      # skip says what it counted and names every path it discounted. An absence
      # nobody can account for is the thing this whole project is against.
      - name: Say why there is no Review Map
        if: steps.scope.outputs.verdict == 'skip'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
          CHANGED: ${{ steps.scope.outputs.changed }}
          APPLICATION: ${{ steps.scope.outputs.application }}
          LINES: ${{ steps.scope.outputs.lines }}
          TRIVIAL_FILES: ${{ steps.scope.outputs.trivial_files }}
          TRIVIAL_LINES: ${{ steps.scope.outputs.trivial_lines }}
        run: |
          {
            echo "## No Review Map for this pull request"
            echo
            if [ "$REASON" = trivial ]; then
              echo "It changes $APPLICATION application file(s) and $LINES line(s), at or under"
              echo "the threshold this repository treats as trivial"
              echo "($TRIVIAL_FILES file(s) and $TRIVIAL_LINES line(s), both)."
              echo
              echo "Raise or lower it with \`review_map.trivial_files\` and"
              echo "\`review_map.trivial_lines\` in \`.accountable-review.yml\`;"
              echo "either at 0 generates a map for every change to application code."
            else
              echo "Nothing in it changes application code:"
              echo "$CHANGED changed path(s), none of them code."
              echo
              echo "A Review Map explains what a change means and what it reaches"
              echo "outside its own diff, so there is nothing here for it to explain."
              echo "Push a change to application code and one is generated."
            fi
            echo
            echo "<details><summary>What changed, how each path was counted, and its lines</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/application-code.txt"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

# SETUP:IF:comment

      # The link, where the reviewer already is. The summary above says the same
      # thing, but nobody opens a workflow run to find out whether there is
      # something worth opening — so the map is announced on the pull request
      # itself, once, by the only step in this job that holds a write token.
      #
      # IT LINKS WHAT DELIVERY SAID, not an artifact. A provider that returns a
      # browsable URL gets that URL commented; the artifact provider has none, so
      # the artifact's own download link is used instead and the wording says it
      # is a zip. Reading the DeliveryResult rather than reaching past it is what
      # keeps this step from being a second thing that knows where the map goes.
      #
      # The comment is upserted against a hidden marker rather than appended.
      # This job runs once per pull request by default, but a ready/draft/ready
      # toggle or a reopen runs it again, and three identical comments would
      # teach people to scroll past all of them.
      #
      # It names the head SHA the map was built from, which is the one defence
      # against the staleness a workflow that does not regenerate on push
      # accepts: a reviewer who sees a SHA that is not the tip knows the map is
      # behind. Not a verdict, and not a status — a link and a revision.
      #
      # The scope guard is first and is not redundant with the two output tests.
      # They would both be empty on a skipped run and the step would stand aside
      # anyway, but reading "which steps run when there is no map" off the guards
      # beats deriving it from which outputs happen to be unset.
      - name: Link the Review Map on the pull request
        if: >-
          steps.scope.outputs.verdict == 'generate'
          && (steps.upload.outputs.artifact-url != ''
          || steps.delivery.outputs.browsable == 'true')
        env:
          # The only step in this job that is handed a write-capable token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BROWSABLE: ${{ steps.delivery.outputs.browsable }}
          STABLE_URL: ${{ steps.delivery.outputs.stable_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          marker='<!-- accountable-review -->'
          short=$(printf '%.7s' "$HEAD_SHA")

          if [ "$BROWSABLE" = true ] && [ -n "$STABLE_URL" ]; then
            link="[Open the Review Map]($STABLE_URL)"
          else
            link="[Download the Review Map]($ARTIFACT_URL), extract it, and open \`index.html\`"
          fi

          body="$marker
          **Review Map** for \`$short\` — $link.

          It explains the change and helps you review it. It does not review it:
          there is no verdict, no score and no approval in there."

          # An existing marked comment is edited rather than replaced. Only the
          # first is considered, so a race that somehow produced two leaves the
          # spare visible rather than silently orphaned.
          ids=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | startswith("<!-- accountable-review -->")) | .id')
          existing=$(printf '%s\n' "$ids" | head -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" \
              -f body="$body" --silent
          else
            gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" --silent
          fi
# SETUP:END:comment
