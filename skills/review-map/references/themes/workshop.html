/* ---- Workshop overrides ---- */
.tier,.tag,.pending{border-radius:var(--r-tag)}
code{border-radius:var(--r-sm)}
.gap,.open,details.searched,details.excerpt,.ip-card,figure.chain,.gt,pre.probe,.buildstate,.primer{border-radius:var(--r)}
.ip-box{border-radius:var(--r-box)}
.key-chg,.key-aff,.key-out{border-radius:3px}

h1,h2,h3,h4{font-weight:600;letter-spacing:-0.03em;font-variation-settings:normal}
h1{letter-spacing:-0.045em;line-height:1.02}
.rail-id .tick{font-weight:600;letter-spacing:-0.02em}
.tier,.tag{font-size:10.5px;letter-spacing:0;text-transform:none;border-color:transparent;padding:2px 8px}
.open,.gap{position:relative;margin-left:16px;border:1px solid var(--gap-rule);padding:16px 18px 16px 28px}
.gap{margin-top:16px}
.open::before,.gap::before{content:"?";position:absolute;left:-16px;top:-14px;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:var(--badge);border:3px solid var(--ground);display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--body);color:#0a0a0a}
.gap::before{content:"!"}
.open>b,.gap>b{font-family:var(--body);font-weight:600;font-size:13.5px;letter-spacing:0}
details.searched>summary,details.evidence>summary{font-weight:500}

.lbl-a{background:var(--hl-yellow);color:var(--hl-ink);padding:3px 7px}
.cp + .cp{border-top:2px dashed var(--rule-strong)}
.ip-card,figure.chain{border:2px solid var(--frame);box-shadow:5px 5px 0 var(--shadow)}
details.excerpt,details.searched,.gt,.primer{border:2px solid var(--frame)}

.open,.gap{border:2px solid var(--frame);box-shadow:4px 4px 0 var(--shadow)}
