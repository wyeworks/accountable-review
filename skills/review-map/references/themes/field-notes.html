/* ---- Field Notes overrides ---- */
.tier,.tag,.pending{border-radius:var(--r-tag)}
code{border-radius:var(--r-sm)}
.gap,.open,details.searched,details.excerpt,.ip-card,figure.chain,.gt,pre.probe,.buildstate,.primer{border-radius:var(--r)}
.ip-box{border-radius:var(--r-box)}
.key-chg,.key-aff,.key-out{border-radius:3px}

h1,h2,h3,h4{font-weight:400;letter-spacing:-0.005em;font-variation-settings:normal}
h1{line-height:1.1}
.tier{font-family:var(--body);font-size:12.5px;font-weight:700;letter-spacing:0;text-transform:none;border:0;background:none;padding:0 2px;gap:6px;color:var(--muted);vertical-align:0}
.tier::before{content:"";flex:0 0 auto;width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:2px solid currentColor}
.tier-unc{background:none;color:var(--unchanged-ink)}
.tier-unc::before{border-style:dashed}
.tier-inf{background:none;color:var(--gap-ink)}
.tier-inf::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.tag{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;border-radius:999px;padding:1px 9px}
.open{background:var(--note-bg);border:1.5px solid var(--note-border);border-radius:4px;box-shadow:3px 3px 0 var(--note-shadow);transform:rotate(-0.3deg);color:var(--ink)}
.open>b{font-family:var(--hand);font-weight:700;font-size:18px;letter-spacing:0;color:var(--gap-ink);margin-bottom:2px}
.gap>b{font-family:var(--hand);font-size:16px;letter-spacing:0;font-weight:700}
.lbl-a{font-family:var(--hand);font-size:19px;letter-spacing:0;text-transform:none;color:var(--hand-ink);font-weight:700}
.cp > .lbl{font-family:var(--hand);font-size:17px;letter-spacing:0;text-transform:none;color:var(--hand-ink)}
.ip-rel{font-family:var(--hand);font-size:15px;letter-spacing:0;text-transform:none;color:var(--hand-ink)}
.ip-chg>.ip-box,.ip-out>.ip-box,.ip-aff>.ip-box{border-width:1.5px}
main p a:not(.doc){text-decoration-style:wavy;text-underline-offset:4px}
main section > p strong{background:linear-gradient(transparent 58%,var(--highlight) 58%)}
details.searched>summary,details.evidence>summary{font-weight:700}
