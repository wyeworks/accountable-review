<!-- Plants exactly one defect: a graded noun asserted, where the word before it ENDS WITH a
     negation — page-invariants.sh § 2. "cannot" ends in "not", so a negation test without a
     LEADING word boundary reads "cannot show the overall risk" as a denial and waves the grade
     through. The sentence still asserts one: it says an overall risk exists and is highest
     somewhere, which is the ranking the format refuses.

     It is its own fixture, and the sentence was chosen by mutation rather than by eye. The
     obvious trap word — "another", which CONTAINS "not" — does not work here: the trailing
     boundary catches it on its own, so a fixture built on it kept failing with the leading
     boundary deleted and pinned nothing. A word ending in the negation is what separates the
     two rules. invariants-risk-score-trailing.html pins the other end. -->
