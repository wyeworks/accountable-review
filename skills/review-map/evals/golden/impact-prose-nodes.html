<!-- PLANTED: the nodes carry clauses instead of labels, and one has its label REPLACED by a
     citation. This is image-one's defect precisely — the panel this component replaced held a
     sentence in every box, so the figure became a word cloud and the edges were left to be
     inferred. The prose is a WARN (length is a judgement) and the standing-in citation is a
     FAIL, so this row pins both verdicts at once.

     Note what is deliberately NOT the defect here. Every node carries a locator, that third node
     included, because a file:line inside the panel is legal now and has its own line to sit on —
     the rule that used to ban citations outright banned this fixture's defect and the reader's
     only way of locating a node along with it. What is still wrong is the address standing IN FOR
     the identifier, so the figure says where to look and never what is there. A fixture planting
     both the standing-in citation and a missing locator would keep failing while either rule
     regressed, and would therefore pin neither. -->
