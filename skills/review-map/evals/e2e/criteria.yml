# The class of every judge criterion, for grade.rb: `truth` or `form`.
#
# A truth criterion asks whether the page is right about the code at head; a form criterion asks
# whether a true page is built right. The two have different bars — evals/README.md § What counts
# as good — because a false sentence costs the reader's trust in every other sentence and a
# misplaced label costs them a click.
#
# This lives here and not in the judge's front matter because the judge file's bytes ARE the
# instrument: judge.rb hashes the whole file into judge_sha, and a class is a reading of the
# verdict, not part of how it was produced. Adding a key there would uncalibrate every judge.
#
# One entry per criterion, numbered as the judge's `criteria:` list is, from 1. test_grade.rb
# fails when a judge has a criterion this file does not class, or this file classes one that no
# judge has — so a criterion split in a judge file is classed in the same commit.

what-changed:
  1: truth   # accurate
  2: form    # complete at the level of deltas
  3: form    # orients, does not teach
  4: truth   # stated limits are true
  5: form    # no verdict

checkpoint-judgments:
  1: form    # a judgment, not a category
  2: form    # one judgment, asked once
  3: form    # the order is not a grade
  4: form    # asks, does not answer

checkpoint-claims:
  1: truth   # every Look at entry is true
  2: truth   # every explanation is true
  3: truth   # every stated absence is true

reading-path:
  1: form    # every stop points where its code is judged
  2: form    # the order has reasons
  3: form    # a stop points, it does not re-explain
  4: truth   # what a stop says is true

impact:
  1: truth   # every affected node is a real consumer
  2: truth   # every edge is true
  3: form    # affected means unchanged
  4: form    # a card's why orients and points

evidence:
  1: truth   # no claim is stated as more than it is
  2: form    # no label on what the diff shows
  3: form    # an untouched line of a changed file is cited
  4: form    # every excerpt is earned
  5: form    # the page reads complete with every block shut
