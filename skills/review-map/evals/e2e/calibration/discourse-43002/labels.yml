# What a correct judge says, per criterion, on gold and on each defects/<variant>.patch.
# A variant lists only the criteria its defect changes; the rest inherit gold's label, or its
# `base` variant's when it names one — and a variant is gated on the criteria where it differs from
# that base. A judge runs only on the variants that carry labels for it.
#
# `~` on the gold row is a criterion the person certifying could not settle on gold: it is not
# gated there, and the corrected copy that removes the doubt is gated instead.
#
# A judge's gold labels are what a person's reading of gold.html against the code concluded, and
# calibrate.rb uses them only for the judges gold.yml lists under `judges`. For a judge not listed
# there, its gold row below is the assumption that reading has to confirm or correct, not a verdict.
#
# Criteria are numbered as in judges/<judge>.md:
#   what-changed          1 accurate · 2 complete at the level of deltas · 3 orients, attributes,
#                         tiers · 4 stated limits true and once · 5 no verdict
#   checkpoint-judgments  1 a judgment, not a category · 2 asked once · 3 order is not a grade ·
#                         4 asks, does not answer
#   checkpoint-explanation 1 explains before it asks · 2 stands alone, never exhaustive ·
#                         3 reads complete with supporting evidence shut
#   checkpoint-claims     1 Look at entries true · 2 explanations true · 3 stated absences true
#   reading-path          1 points where its code is judged · 2 order has reasons · 3 points,
#                         does not re-explain · 4 what a stop says is true
#   impact                1 affected nodes are real consumers · 2 edges true · 3 affected means
#                         unchanged · 4 a card's why orients and points
#   evidence              1 no claim stated as more than it is · 2 no label on what the diff shows ·
#                         3 untouched line of a changed file cited · 4 excerpts earned · 5 every field
#                         complete with its excerpt shut
gold:
  what-changed: [pass, pass, pass, pass, pass]
  checkpoint-judgments: [pass, pass, pass, pass]
  checkpoint-explanation: [pass, pass, pass]
  checkpoint-claims: [pass, fail, pass]     # 2: cp-d calls the click shortcut "a toggle between two sizes over a range of eight"; the rules allow
                                            # five (1x1, 1x2, 2x2, 3x2, 4x2), eight counts the combinations the full-width rule forbids
  reading-path: [pass, pass, pass, pass]
  impact: [pass, pass, pass, pass]
  evidence: [~, pass, pass, pass, pass]     # 1: unsettled — cp-d's "a press only becomes a drag after eight pixels of travel" cites the threshold
                                            # reports.gjs passes, but what the threshold means is d-resize-handles.gts, unchanged; its Look at entry
                                            # carries `from unchanged code`, the sentence does not
variants:
  what-changed-headline:             # the <h2> says each admin's sizes are saved for them; the table has no user column
    what-changed: {1: fail}
  what-changed-wrong-delta:          # "admins and moderators" see the handles — canEdit is currentUser?.admin
    what-changed: {1: fail}
  what-changed-steps-as-deltas:      # one delta split into a bullet list of execution steps
    what-changed: {2: fail}
  what-changed-unattributed-intent:  # "this is what admins asked for" — an intent the diff does not show, unattributed and untiered
    what-changed: {3: fail}
  what-changed-false-limit:          # claims the Ember client could not be read; the page reads it throughout
    what-changed: {4: fail}
  what-changed-grading:              # "small, low-risk change and looks safe to approve"
    what-changed: {5: fail}
  what-changed-coverage:             # "every changed file was reviewed and no other issues were found"
    what-changed: {5: fail}

  checkpoint-judgments-category:     # checkpoint C's review question becomes "Review the controller and model validations."
    checkpoint-judgments: {1: fail}
  checkpoint-judgments-place-heading: # checkpoint C's heading becomes "Controller and model changes"
    checkpoint-judgments: {1: fail}
  checkpoint-judgments-unmerged:     # a checkpoint F asking checkpoint A's question from the endpoint's side
    checkpoint-judgments: {2: fail}
  checkpoint-judgments-ranked:       # "This is the most important checkpoint on the page."
    checkpoint-judgments: {3: fail}
  checkpoint-judgments-verdict:      # checkpoint D's question: "This is a bug: a click should …"
    checkpoint-judgments: {4: fail}

  checkpoint-explanation-step-in-context: # checkpoint B opens on setSize and LayoutUpdater and leaves what the layout is to Context
    checkpoint-explanation: {1: fail}
  checkpoint-explanation-callers-pointer: # checkpoint C's bulk-endpoint paragraph cut to "see Impact outside the diff"
    checkpoint-explanation: {2: fail}
  checkpoint-explanation-exhaustive: # checkpoint D padded with the handle component's internals
    checkpoint-explanation: {2: fail}
  checkpoint-explanation-gap-in-evidence: # checkpoint D's GAP removed; the untested larger-card click is said only in a Look at clause
    checkpoint-explanation: {3: fail}

  checkpoint-claims-lookat-line:     # the click-test entry cites reports-test.gjs:414-494, the two-resizes test
    checkpoint-claims: {1: fail}
  checkpoint-claims-corrected:       # gold with cp-d's "range of eight" made five
    checkpoint-claims: {2: pass}
  checkpoint-claims-explanation:     # "the layout endpoint updates the stored rows in place" — it deletes every row and re-inserts
    base: checkpoint-claims-corrected
    checkpoint-claims: {2: fail}
  checkpoint-claims-gap:             # GAP: "nothing tests a click on a resize handle" — reports-test.gjs:284-338 does
    checkpoint-claims: {3: fail}

  reading-path-wrong-pointer:        # the layout-updater stop points at checkpoint E
    reading-path: {1: fail}
  reading-path-unreasoned-order:     # the stop that says it comes before the checks, moved last
    reading-path: {2: fail}
  reading-path-restates:             # stop 03's why is checkpoint A's explanation and question again
    reading-path: {3: fail}
  reading-path-false-claim:          # stop 04: "each received item updates its own stored row in place"
    reading-path: {4: fail}

  impact-wrong-consumer:             # path A's affected node is toggleSection, which never PUTs the layout
    impact: {1: fail}
  impact-false-edge:                 # "calls": the parser does not call the modal
    impact: {2: fail}
  impact-changed-as-affected:        # section.rb, which the diff changes, listed under Affected, not changed
    impact: {3: fail}
  impact-why-walks-hops:             # card A's why narrates both nodes of the path beneath it
    impact: {4: fail}

  evidence-corrected:                # gold with cp-d's eight-pixel claim citing d-resize-handles.gts and tiered `from unchanged code`
    evidence: {1: pass}
  evidence-unlabelled-inference:     # the overlapping-saves claim loses its `inferred`
    base: evidence-corrected
    evidence: {1: fail}
  evidence-labelled-diff-claim:      # § 01's default of 1, which the migration adds, gains `from unchanged code`
    evidence: {2: fail}
  evidence-uncited-untouched-line:   # cp-c's bulk_reports claim loses its citation; bulk_reports is outside every hunk of the changed controller
    evidence: {3: fail}
  evidence-unearned-excerpt:         # a stylesheet excerpt beside the default-report seeder entry
    evidence: {4: fail}
  evidence-hidden-claim:             # checkpoint B's section entry loses its clause; what to see is only inside the excerpt
    evidence: {5: fail}
